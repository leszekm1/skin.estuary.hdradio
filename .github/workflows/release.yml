name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read add-on metadata
        id: metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          addon = ET.parse("addon.xml").getroot()
          print(f"addon_id={addon.attrib['id']}")
          print(f"version={addon.attrib['version']}")
          PY

      - name: Build and validate install ZIP
        id: package
        env:
          ADDON_ID: ${{ steps.metadata.outputs.addon_id }}
          ADDON_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          release_zip="${ADDON_ID}-${ADDON_VERSION}.zip"
          python3 tools/package-addon.py --addon-id "$ADDON_ID" --output "$release_zip"
          python3 tools/validate-addon-zip.py --addon-id "$ADDON_ID" "$release_zip"
          sha256sum "$release_zip" > "$release_zip.sha256"
          echo "release_zip=$release_zip" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.addon_id }}-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.package.outputs.release_zip }}
            ${{ steps.package.outputs.release_zip }}.sha256
          if-no-files-found: error

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v${{ steps.metadata.outputs.version }}"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.package.outputs.release_zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_ZIP" "$RELEASE_ZIP.sha256" \
            --title "${{ steps.metadata.outputs.addon_id }} ${{ steps.metadata.outputs.version }}" \
            --generate-notes
